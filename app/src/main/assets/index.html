<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>液态玻璃 AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --glass-bg: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.18);
    --glass-shadow: rgba(0,0,0,0.25);
    --accent: #7c5bf5;
    --accent2: #f55ba0;
    --text: #e8e4f0;
    --text-dim: rgba(255,255,255,0.55);
    --radius: 20px;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0a0a1a;
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ── 动态背景 ── */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .bg .orb {
    position: absolute; border-radius: 50%; filter: blur(100px); opacity: .55;
    animation: drift 12s ease-in-out infinite alternate;
  }
  .bg .orb:nth-child(1) { width: 520px; height: 520px; background: #7c5bf5; top: -10%; left: -8%; animation-duration: 14s; }
  .bg .orb:nth-child(2) { width: 440px; height: 440px; background: #f55ba0; bottom: -12%; right: -6%; animation-duration: 11s; animation-delay: -3s; }
  .bg .orb:nth-child(3) { width: 360px; height: 360px; background: #3bb8f0; top: 40%; left: 55%; animation-duration: 16s; animation-delay: -6s; }
  .bg .orb:nth-child(4) { width: 300px; height: 300px; background: #22d68a; top: 10%; right: 20%; animation-duration: 13s; animation-delay: -2s; }
  @keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(60px,40px) scale(1.12); } }

  .bg::after {
    content: ''; position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
    opacity: .35; pointer-events: none;
  }

  /* ── 布局 ── */
  .app {
    position: relative; z-index: 1;
    width: min(920px, 96vw); height: min(780px, 96vh);
    display: flex; flex-direction: column;
  }

  /* ── 头部 ── */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; margin-bottom: 10px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    backdrop-filter: blur(24px) saturate(1.6);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    box-shadow: 0 8px 32px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .header h1 {
    font-size: 18px; font-weight: 600;
    background: linear-gradient(135deg, #c8b6ff, #f55ba0, #7c5bf5);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -.3px;
  }
  .header-actions { display: flex; gap: 8px; }

  /* ── 玻璃按钮 ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border: none; cursor: pointer;
    font: 500 13px/1 'Inter', sans-serif; color: var(--text);
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px; backdrop-filter: blur(12px); transition: all .2s;
  }
  .btn:hover { background: rgba(255,255,255,.18); transform: translateY(-1px); }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 16px; height: 16px; }

  /* ── 设置面板 ── */
  .settings-panel {
    display: none; flex-direction: column; gap: 12px;
    padding: 18px 20px; margin-bottom: 10px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    backdrop-filter: blur(24px) saturate(1.6);
    box-shadow: 0 8px 32px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.12);
    animation: slideDown .3s ease;
  }
  .settings-panel.show { display: flex; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 500; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; }
  .field input, .field select, .field textarea {
    padding: 10px 14px; border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
    background: rgba(255,255,255,.06); color: var(--text);
    font: 400 14px/1 'Inter', sans-serif; outline: none; transition: border-color .2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field input::placeholder, .field textarea::placeholder { color: var(--text-dim); }
  .field select option { background: #1a1a2e; }
  .settings-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .settings-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  /* ── 聊天区域 ── */
  .chat-area {
    flex: 1; overflow-y: auto; padding: 16px 20px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    backdrop-filter: blur(20px) saturate(1.4);
    box-shadow: 0 8px 32px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.1);
    margin-bottom: 10px; display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 3px; }

  /* ── 消息 ── */
  .msg { display: flex; gap: 10px; max-width: 85%; animation: fadeUp .3s ease; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg .avatar {
    width: 34px; height: 34px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .msg.user .avatar { background: linear-gradient(135deg, #f55ba0, #ff8a5c); }
  .msg.assistant .avatar { background: linear-gradient(135deg, #7c5bf5, #3bb8f0); }

  .msg .bubble {
    padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.65;
    word-break: break-word; white-space: pre-wrap;
  }
  .msg.user .bubble {
    background: rgba(124,91,245,.22); border: 1px solid rgba(124,91,245,.3);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
    border-bottom-left-radius: 4px;
  }
  .msg .bubble code { background: rgba(0,0,0,.3); padding: 2px 6px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .msg .bubble pre { background: rgba(0,0,0,.35); padding: 12px; border-radius: 10px; overflow-x: auto; margin: 8px 0; }
  .msg .bubble pre code { background: none; padding: 0; }

  .msg.assistant .bubble.streaming::after { content: '▍'; animation: blink 1s step-end infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }

  /* 附件预览 */
  .msg .attachment-preview {
    margin-top: 8px; padding: 8px 10px;
    background: rgba(0,0,0,.2); border-radius: 10px;
    font-size: 12px; color: var(--text-dim);
    display: flex; align-items: center; gap: 6px;
  }
  .msg .attachment-preview img {
    max-width: 200px; max-height: 160px; border-radius: 8px; object-fit: cover;
  }

  /* ── 空状态 ── */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    color: var(--text-dim); text-align: center;
  }
  .empty-state .icon { font-size: 48px; opacity: .6; }
  .empty-state p { font-size: 14px; max-width: 320px; line-height: 1.5; }

  /* ── 工具栏 ── */
  .toolbar {
    display: flex; align-items: center; gap: 4px;
    padding: 0 4px; margin-bottom: 6px;
  }
  .tool-btn {
    width: 36px; height: 36px; border: none; cursor: pointer;
    border-radius: 10px; background: transparent; color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    transition: all .2s; position: relative;
  }
  .tool-btn:hover { background: rgba(255,255,255,.1); color: var(--text); }
  .tool-btn:active { transform: scale(.9); }
  .tool-btn svg { width: 18px; height: 18px; }
  .tool-btn .badge {
    position: absolute; top: 2px; right: 2px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent2); display: none;
  }
  .tool-btn .badge.show { display: block; }
  .tool-btn input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }

  .toolbar .sep {
    width: 1px; height: 20px; background: rgba(255,255,255,.12); margin: 0 4px;
  }

  /* 附件栏 */
  .attach-bar {
    display: none; align-items: center; gap: 8px;
    padding: 8px 14px; margin-bottom: 6px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; font-size: 12px; color: var(--text-dim);
    animation: slideDown .2s ease;
  }
  .attach-bar.show { display: flex; }
  .attach-bar .attach-item {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; background: rgba(255,255,255,.08);
    border-radius: 8px; max-width: 200px;
  }
  .attach-bar .attach-item .name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .attach-bar .attach-item .remove {
    cursor: pointer; opacity: .6; font-size: 14px; line-height: 1;
  }
  .attach-bar .attach-item .remove:hover { opacity: 1; color: #ff8a8a; }
  .attach-bar .attach-item img {
    width: 28px; height: 28px; border-radius: 6px; object-fit: cover;
  }

  /* ── 输入栏 ── */
  .input-bar {
    display: flex; gap: 10px; align-items: flex-end;
    padding: 14px 18px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    backdrop-filter: blur(24px) saturate(1.6);
    box-shadow: 0 8px 32px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .input-bar textarea {
    flex: 1; resize: none; border: none; outline: none;
    background: rgba(255,255,255,.06); color: var(--text);
    padding: 10px 14px; border-radius: 14px;
    font: 400 14px/1.5 'Inter', sans-serif;
    min-height: 44px; max-height: 140px;
    border: 1px solid rgba(255,255,255,.1); transition: border-color .2s;
  }
  .input-bar textarea:focus { border-color: var(--accent); }
  .input-bar textarea::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 44px; height: 44px; border: none; cursor: pointer;
    border-radius: 14px; flex-shrink: 0;
    background: linear-gradient(135deg, #7c5bf5, #f55ba0);
    color: #fff; display: flex; align-items: center; justify-content: center;
    transition: all .2s; box-shadow: 0 4px 16px rgba(124,91,245,.35);
  }
  .send-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(124,91,245,.5); }
  .send-btn:active { transform: scale(.93); }
  .send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  .send-btn svg { width: 20px; height: 20px; }

  /* ── 提示 ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    padding: 10px 20px; border-radius: 14px;
    background: rgba(255,80,80,.2); border: 1px solid rgba(255,80,80,.3);
    backdrop-filter: blur(16px); color: #ff8a8a;
    font-size: 13px; opacity: 0; transition: all .35s ease;
    z-index: 100; pointer-events: none;
  }
  .toast.success { background: rgba(34,214,138,.2); border-color: rgba(34,214,138,.3); color: #22d68a; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── 模型预设卡片 ── */
  .model-presets {
    display: none; gap: 8px; padding: 10px 0; flex-wrap: wrap;
  }
  .model-presets.show { display: flex; }
  .preset-chip {
    padding: 6px 14px; border-radius: 20px; cursor: pointer;
    font-size: 12px; font-weight: 500; color: var(--text-dim);
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    transition: all .2s;
  }
  .preset-chip:hover { background: rgba(124,91,245,.2); border-color: var(--accent); color: var(--text); }
  .preset-chip.active { background: rgba(124,91,245,.3); border-color: var(--accent); color: var(--text); }

  /* ── 响应式 ── */
  @media (max-width: 640px) {
    .app { width: 100vw; height: 100vh; border-radius: 0; padding: 8px; }
    .header, .settings-panel, .chat-area, .input-bar { border-radius: 14px; }
    .settings-row, .settings-row3 { grid-template-columns: 1fr; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>

<div class="bg">
  <div class="orb"></div><div class="orb"></div><div class="orb"></div><div class="orb"></div>
</div>

<div class="app">
  <!-- 头部 -->
  <div class="header">
    <h1>✦ 液态玻璃 AI</h1>
    <div class="header-actions">
      <button class="btn" id="exportBtn" title="导出对话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        导出
      </button>
      <button class="btn" id="clearBtn" title="清空对话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0v12a2 2 0 01-2 2H8a2 2 0 01-2-2V6"/></svg>
      </button>
      <button class="btn" id="settingsBtn" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2m-9.5-12.5l1.7 1m15.6-1l-1.7 1M4.2 19.8l1.4-1.4m12.8 0l1.4 1.4M1 12h2m18 0h2"/></svg>
      </button>
    </div>
  </div>

  <!-- 设置 -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-row">
      <div class="field">
        <label>接口地址</label>
        <input type="text" id="apiBase" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1">
      </div>
      <div class="field">
        <label>API 密钥</label>
        <input type="password" id="apiKey" placeholder="sk-...">
      </div>
    </div>
    <div class="field">
      <label>模型预设</label>
      <div class="model-presets show" id="modelPresets">
        <span class="preset-chip active" data-model="gpt-4o">GPT-4o</span>
        <span class="preset-chip" data-model="gpt-4o-mini">GPT-4o Mini</span>
        <span class="preset-chip" data-model="claude-sonnet-4-20250514">Claude Sonnet 4</span>
        <span class="preset-chip" data-model="deepseek-chat">DeepSeek</span>
        <span class="preset-chip" data-model="gemini-2.5-flash">Gemini 2.5 Flash</span>
        <span class="preset-chip" data-model="qwen-plus">通义千问</span>
        <span class="preset-chip" data-model="moonshot-v1-8k">月之暗面</span>
      </div>
    </div>
    <div class="settings-row3">
      <div class="field">
        <label>自定义模型名</label>
        <input type="text" id="modelName" placeholder="gpt-4o" value="gpt-4o">
      </div>
      <div class="field">
        <label>创造力 (Temperature)</label>
        <input type="number" id="temperature" min="0" max="2" step="0.1" value="0.7">
      </div>
      <div class="field">
        <label>最大 Tokens</label>
        <input type="number" id="maxTokens" min="256" max="128000" step="256" value="4096">
      </div>
    </div>
    <div class="field">
      <label>系统提示词</label>
      <textarea id="systemPrompt" rows="2" placeholder="你是一个有帮助的AI助手。" style="resize:vertical"></textarea>
    </div>
  </div>

  <!-- 聊天 -->
  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="icon">✦</div>
      <p>配置 API 密钥后开始对话<br><span style="font-size:12px;opacity:.6">支持 OpenAI / Claude / DeepSeek / 通义 / Gemini 等兼容接口</span></p>
    </div>
  </div>

  <!-- 附件栏 -->
  <div class="attach-bar" id="attachBar">
    <span>📎</span>
    <div id="attachList"></div>
  </div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <button class="tool-btn" id="uploadFileBtn" title="上传文件">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
      <input type="file" id="fileInput" multiple>
    </button>
    <button class="tool-btn" id="uploadImgBtn" title="上传图片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <input type="file" id="imgInput" accept="image/*" multiple>
      <div class="badge" id="imgBadge"></div>
    </button>
    <div class="sep"></div>
    <button class="tool-btn" id="voiceBtn" title="语音输入">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button class="tool-btn" id="codeBtn" title="插入代码块">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </button>
    <div class="sep"></div>
    <button class="tool-btn" id="copyLastBtn" title="复制上一条回复">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
    </button>
    <button class="tool-btn" id="stopBtn" title="停止生成" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
  </div>

  <!-- 输入 -->
  <div class="input-bar">
    <textarea id="userInput" placeholder="输入消息… (Shift+Enter 换行)" rows="1"></textarea>
    <button class="send-btn" id="sendBtn" title="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  // ── 元素 ──
  const chatArea = document.getElementById('chatArea');
  const emptyState = document.getElementById('emptyState');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const clearBtn = document.getElementById('clearBtn');
  const exportBtn = document.getElementById('exportBtn');
  const toastEl = document.getElementById('toast');
  const stopBtn = document.getElementById('stopBtn');
  const copyLastBtn = document.getElementById('copyLastBtn');
  const codeBtn = document.getElementById('codeBtn');
  const voiceBtn = document.getElementById('voiceBtn');
  const fileInput = document.getElementById('fileInput');
  const imgInput = document.getElementById('imgInput');
  const attachBar = document.getElementById('attachBar');
  const attachList = document.getElementById('attachList');
  const modelPresets = document.getElementById('modelPresets');

  const apiBaseInput = document.getElementById('apiBase');
  const apiKeyInput = document.getElementById('apiKey');
  const modelNameInput = document.getElementById('modelName');
  const temperatureInput = document.getElementById('temperature');
  const maxTokensInput = document.getElementById('maxTokens');
  const systemPromptInput = document.getElementById('systemPrompt');

  let messages = [];
  let attachments = []; // {name, type, dataUrl, size}
  let streaming = false;
  let abortCtrl = null;

  // ── 持久化 ──
  const SK = 'lgai_settings';
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(SK));
      if (s) {
        apiBaseInput.value = s.apiBase || '';
        apiKeyInput.value = s.apiKey || '';
        modelNameInput.value = s.model || 'gpt-4o';
        temperatureInput.value = s.temperature ?? 0.7;
        maxTokensInput.value = s.maxTokens ?? 4096;
        systemPromptInput.value = s.systemPrompt || '';
        // 激活对应预设芯片
        document.querySelectorAll('.preset-chip').forEach(c => {
          c.classList.toggle('active', c.dataset.model === modelNameInput.value);
        });
      }
    } catch {}
  }
  function saveSettings() {
    localStorage.setItem(SK, JSON.stringify({
      apiBase: apiBaseInput.value.trim(),
      apiKey: apiKeyInput.value.trim(),
      model: modelNameInput.value.trim(),
      temperature: parseFloat(temperatureInput.value),
      maxTokens: parseInt(maxTokensInput.value),
      systemPrompt: systemPromptInput.value.trim(),
    }));
  }
  loadSettings();
  [apiBaseInput, apiKeyInput, modelNameInput, temperatureInput, maxTokensInput, systemPromptInput]
    .forEach(el => el.addEventListener('change', saveSettings));

  // ── 模型预设 ──
  modelPresets.addEventListener('click', (e) => {
    const chip = e.target.closest('.preset-chip');
    if (!chip) return;
    document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    modelNameInput.value = chip.dataset.model;
    saveSettings();
  });

  // ── 设置切换 ──
  settingsBtn.addEventListener('click', () => settingsPanel.classList.toggle('show'));

  // ── 清空 ──
  clearBtn.addEventListener('click', () => {
    if (messages.length && !confirm('确定清空所有对话？')) return;
    messages = [];
    chatArea.innerHTML = '';
    chatArea.appendChild(emptyState);
    emptyState.style.display = 'flex';
    clearAttachments();
  });

  // ── 导出对话 ──
  exportBtn.addEventListener('click', () => {
    if (!messages.length) { showToast('暂无对话可导出'); return; }
    let md = `# 液态玻璃 AI 对话\n\n导出时间: ${new Date().toLocaleString('zh-CN')}\n\n---\n\n`;
    messages.forEach(m => {
      const role = m.role === 'user' ? '👤 用户' : '✦ AI';
      md += `### ${role}\n\n${m.content}\n\n---\n\n`;
    });
    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `对话记录_${new Date().toISOString().slice(0,10)}.md`;
    a.click();
    showToast('已导出 Markdown 文件 ✓', 'success');
  });

  // ── Toast ──
  function showToast(msg, type = '', duration = 3000) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show' + (type ? ' ' + type : '');
    setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  // ── 自动高度 ──
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
  });

  // ── 发送 ──
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);

  // ── 停止生成 ──
  stopBtn.addEventListener('click', () => { if (abortCtrl) abortCtrl.abort(); });

  // ── 复制最后回复 ──
  copyLastBtn.addEventListener('click', () => {
    const last = [...messages].reverse().find(m => m.role === 'assistant');
    if (!last) { showToast('暂无可复制的回复'); return; }
    navigator.clipboard.writeText(last.content).then(
      () => showToast('已复制到剪贴板 ✓', 'success'),
      () => showToast('复制失败')
    );
  });

  // ── 代码块插入 ──
  codeBtn.addEventListener('click', () => {
    const start = userInput.selectionStart;
    const val = userInput.value;
    userInput.value = val.slice(0, start) + '```\n\n```' + val.slice(start);
    userInput.selectionStart = userInput.selectionEnd = start + 4;
    userInput.focus();
  });

  // ── 语音输入 ──
  let recognizing = false;
  let recognition = null;
  voiceBtn.addEventListener('click', () => {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      showToast('当前浏览器不支持语音输入'); return;
    }
    if (recognizing) { recognition.stop(); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'zh-CN';
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.onstart = () => {
      recognizing = true;
      voiceBtn.style.color = '#f55ba0';
      voiceBtn.style.background = 'rgba(245,91,160,.15)';
      showToast('正在聆听…', 'success');
    };
    recognition.onresult = (e) => {
      let transcript = '';
      for (let i = e.resultIndex; i < e.results.length; i++) transcript += e.results[i][0].transcript;
      userInput.value = transcript;
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
    };
    recognition.onend = () => {
      recognizing = false;
      voiceBtn.style.color = '';
      voiceBtn.style.background = '';
    };
    recognition.onerror = (e) => {
      recognizing = false;
      voiceBtn.style.color = '';
      voiceBtn.style.background = '';
      if (e.error !== 'no-speech') showToast('语音识别出错: ' + e.error);
    };
    recognition.start();
  });

  // ── 文件/图片上传 ──
  fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
  imgInput.addEventListener('change', (e) => handleFiles(e.target.files));

  function handleFiles(files) {
    for (const f of files) {
      if (f.size > 20 * 1024 * 1024) { showToast(`"${f.name}" 超过20MB限制`); continue; }
      const reader = new FileReader();
      reader.onload = () => {
        attachments.push({ name: f.name, type: f.type, dataUrl: reader.result, size: f.size });
        renderAttachBar();
      };
      if (f.type.startsWith('image/')) {
        reader.readAsDataURL(f);
      } else {
        // 文本文件读取内容
        if (f.type.startsWith('text/') || /\.(txt|md|json|csv|xml|yaml|yml|js|ts|py|java|c|cpp|go|rs|html|css|sh|sql)$/i.test(f.name)) {
          const textReader = new FileReader();
          textReader.onload = () => {
            attachments.push({ name: f.name, type: f.type, size: f.size, textContent: textReader.result });
            renderAttachBar();
          };
          textReader.readAsText(f);
        } else {
          reader.readAsDataURL(f);
        }
      }
    }
    fileInput.value = '';
    imgInput.value = '';
  }

  function renderAttachBar() {
    if (!attachments.length) { attachBar.classList.remove('show'); return; }
    attachBar.classList.add('show');
    attachList.innerHTML = '';
    attachments.forEach((a, i) => {
      const div = document.createElement('div');
      div.className = 'attach-item';
      const isImg = a.type.startsWith('image/');
      const icon = isImg ? `<img src="${a.dataUrl}" alt="">` : '📄';
      div.innerHTML = `${icon}<span class="name">${a.name}</span><span class="remove" data-i="${i}">✕</span>`;
      attachList.appendChild(div);
    });
    attachList.querySelectorAll('.remove').forEach(btn => {
      btn.addEventListener('click', () => {
        attachments.splice(parseInt(btn.dataset.i), 1);
        renderAttachBar();
      });
    });
  }

  function clearAttachments() {
    attachments = [];
    renderAttachBar();
  }

  // ── Markdown 渲染 ──
  function renderMd(text) {
    text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${escHtml(code.trim())}</code></pre>`);
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:#7c5bf5">$1</a>');
    return text;
  }
  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── 添加消息 ──
  function addMessage(role, content, attachInfo) {
    if (emptyState.style.display !== 'none') emptyState.style.display = 'none';
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const avatar = role === 'user' ? '👤' : '✦';
    let attachHtml = '';
    if (attachInfo) {
      attachInfo.forEach(a => {
        if (a.type?.startsWith('image/')) {
          attachHtml += `<div class="attachment-preview"><img src="${a.dataUrl}" alt="${a.name}"></div>`;
        } else {
          attachHtml += `<div class="attachment-preview">📄 ${a.name} (${formatSize(a.size)})</div>`;
        }
      });
    }
    div.innerHTML = `
      <div class="avatar">${avatar}</div>
      <div class="bubble">${role === 'assistant' ? renderMd(content) : escHtml(content)}${attachHtml}</div>
    `;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
  }

  function formatSize(b) {
    if (b < 1024) return b + 'B';
    if (b < 1024*1024) return (b/1024).toFixed(1) + 'KB';
    return (b/1024/1024).toFixed(1) + 'MB';
  }

  // ── 发送消息 ──
  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text && !attachments.length) return;
    if (streaming) return;

    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) { showToast('请先配置 API 密钥 ⚙️'); settingsPanel.classList.add('show'); return; }

    // 构建用户消息
    const currentAttach = [...attachments];
    const displayText = text || '(请分析附件)';
    addMessage('user', displayText, currentAttach);

    // 构建 API 消息内容
    let userContent;
    const hasImages = currentAttach.some(a => a.type?.startsWith('image/'));

    if (hasImages || currentAttach.length > 1) {
      // 多模态消息
      userContent = [];
      if (text) userContent.push({ type: 'text', text });
      currentAttach.forEach(a => {
        if (a.type?.startsWith('image/')) {
          userContent.push({ type: 'image_url', image_url: { url: a.dataUrl } });
        } else if (a.textContent) {
          userContent.push({ type: 'text', text: `\n\n--- 文件: ${a.name} ---\n${a.textContent}\n--- 文件结束 ---\n` });
        }
      });
    } else if (currentAttach.length === 1 && currentAttach[0].textContent) {
      // 单个文本文件
      userContent = text
        ? `${text}\n\n--- 文件: ${currentAttach[0].name} ---\n${currentAttach[0].textContent}\n--- 文件结束 ---`
        : `请分析以下文件内容 (${currentAttach[0].name}):\n\n${currentAttach[0].textContent}`;
    } else {
      userContent = text;
    }

    messages.push({ role: 'user', content: userContent });
    userInput.value = '';
    userInput.style.height = 'auto';
    clearAttachments();

    // API 请求
    const apiBase = apiBaseInput.value.trim().replace(/\/+$/, '') || 'https://api.openai.com/v1';
    const model = modelNameInput.value.trim() || 'gpt-4o';
    const temperature = parseFloat(temperatureInput.value) || 0.7;
    const maxTokens = parseInt(maxTokensInput.value) || 4096;
    const systemPrompt = systemPromptInput.value.trim();

    const apiMessages = [];
    if (systemPrompt) apiMessages.push({ role: 'system', content: systemPrompt });
    apiMessages.push(...messages);

    const assistantDiv = addMessage('assistant', '');
    const bubble = assistantDiv.querySelector('.bubble');
    bubble.classList.add('streaming');
    streaming = true;
    sendBtn.disabled = true;
    stopBtn.style.display = 'flex';
    abortCtrl = new AbortController();

    try {
      const resp = await fetch(`${apiBase}/chat/completions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({ model, messages: apiMessages, temperature, max_tokens: maxTokens, stream: true }),
        signal: abortCtrl.signal,
      });

      if (!resp.ok) {
        const errBody = await resp.text();
        let errMsg = `API 错误 ${resp.status}`;
        try { const j = JSON.parse(errBody); errMsg = j.error?.message || errMsg; } catch {}
        throw new Error(errMsg);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '', buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || !trimmed.startsWith('data: ')) continue;
          const data = trimmed.slice(6);
          if (data === '[DONE]') continue;
          try {
            const j = JSON.parse(data);
            const delta = j.choices?.[0]?.delta?.content;
            if (delta) { fullText += delta; bubble.innerHTML = renderMd(fullText); chatArea.scrollTop = chatArea.scrollHeight; }
          } catch {}
        }
      }
      messages.push({ role: 'assistant', content: fullText });
    } catch (err) {
      if (err.name === 'AbortError') {
        bubble.innerHTML += `<br><span style="color:var(--text-dim);font-size:12px">⏹ 已停止生成</span>`;
        if (bubble.textContent.trim()) messages.push({ role: 'assistant', content: bubble.textContent });
      } else {
        bubble.innerHTML = `<span style="color:#ff8a8a">⚠️ ${escHtml(err.message)}</span>`;
        showToast(err.message);
      }
    } finally {
      bubble.classList.remove('streaming');
      streaming = false;
      sendBtn.disabled = false;
      stopBtn.style.display = 'none';
      abortCtrl = null;
    }
  }
})();
</script>
</body>
</html>
